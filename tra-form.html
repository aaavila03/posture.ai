<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>Asset Security Questions</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="intake">
  <header class="topbar">
    <div class="brand" aria-label="Posture.ai"><svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true"><path class="logo-shield" d="M32 4 L54 12 V30 C54 44 44 54 32 60 C20 54 10 44 10 30 V12 Z"/><rect class="logo-bar" x="19" y="32" width="6" height="12" rx="3"/><rect class="logo-bar" x="29" y="25" width="6" height="19" rx="3"/><rect class="logo-bar" x="39" y="17" width="6" height="27" rx="3"/></svg><span class="logo-word">Posture<span class="logo-ai">.ai</span></span> <span class="muted brand-tag">Vendor security questionnaire</span></div>
    <span id="org-brand" class="org-brand hidden"></span>
    <div class="progress-wrap" title="Controls answered">
      <div class="progress"><div id="progress-bar"></div></div>
      <span id="progress-text" class="small muted"></span>
    </div>
  </header>

  <main class="intake-main">
    <div class="card intro">
      <h1 id="form-title">Asset security questions</h1>
      <p id="form-intro" class="muted">Loading…</p>
    </div>
    <form id="tra-outside-form" class="hidden" novalidate>
      <div class="card tra-form-section" id="section-contributor">
        <h2>About you</h2>
        <div class="form-grid">
          <label>Your name <input id="contributor-name" maxlength="200" autocomplete="name" /></label>
          <label>Your email <input id="contributor-email" type="email" maxlength="254" autocomplete="email" /></label>
        </div>
      </div>
      <div class="card tra-form-section" id="section-impact"></div>
      <div class="card tra-form-section" id="section-profile"></div>
      <div class="card tra-form-section" id="section-controls"></div>
      <div class="card tra-form-section">
        <p id="save-state" class="small muted tra-form-status"></p>
        <button type="submit" class="primary">Submit answers</button>
      </div>
    </form>
  </main>
  <script type="module" src="tra-form.js"></script>
</body>
</html>
