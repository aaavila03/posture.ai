<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>Technology Request Questions</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="intake">
  <header class="topbar">
    <div class="brand" aria-label="Posture.ai"><svg class="logo-mark" viewBox="180 84 228 280" aria-hidden="true"><path class="logo-shield" d="M294 99 L394 134 V215 C394 282 348 326 294 349 C240 326 194 282 194 215 V134 Z"/><rect class="logo-bar" x="237" y="230" width="24" height="47" rx="12"/><rect class="logo-bar" x="283" y="198" width="24" height="79" rx="12"/><rect class="logo-bar" x="327" y="160" width="24" height="117" rx="12"/></svg><span class="logo-word">Posture<span class="logo-ai">.ai</span></span> <span class="muted brand-tag">Technology request questions</span></div>
    <span id="org-brand" class="org-brand hidden"></span>
    <div class="progress-wrap" title="Questions answered">
      <div class="progress"><div id="progress-bar"></div></div>
      <span id="progress-text" class="small muted"></span>
    </div>
  </header>

  <main class="intake-main">
    <div class="card intro">
      <h1 id="form-title">Technology request questions</h1>
      <p id="form-intro" class="muted">Loading…</p>
    </div>
    <form id="intake-form" class="hidden" novalidate>
      <div class="card tra-form-section" id="section-contributor">
        <h2>About you</h2>
        <div class="form-grid">
          <label>Your name <input id="contributor-name" maxlength="200" autocomplete="name" /></label>
          <label>Your email <input id="contributor-email" type="email" maxlength="254" autocomplete="email" /></label>
        </div>
      </div>
      <div id="sections"></div>
      <div class="card tra-form-section">
        <p id="save-state" class="small muted tra-form-status"></p>
        <button type="submit" class="primary">Submit answers</button>
      </div>
    </form>
  </main>
  <script type="module" src="assessment-intake.js"></script>
</body>
</html>
